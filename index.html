function watchStartMedia(d,pos,paused){const ne=next(d)||[1,1],k=`${d.id}:${ne[0]}:${ne[1]}`;if(SRV&&F[k]&&F[k].on)F[k].px=1;play(d.id,ne[0],ne[1]);setTimeout(()=>{const v=$('vd');if(v&&Number.isFinite(+pos)&&pos>0)v.currentTime=pos;if(v){if(paused)v.pause();else v.play().catch(()=>{})}watchLoop()},450)}

async function rtcGetStream(){if(rtcStream)return rtcStream;const v=$('vd');if(!v||!v.captureStream)throw new Error('capture');if(v.readyState<2)await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('media')),20000);v.addEventListener('loadeddata',()=>{clearTimeout(t);ok()},{once:true})});rtcStream=v.captureStream();const a=$('au');if(a&&a.captureStream)try{a.captureStream().getAudioTracks().forEach(t=>rtcStream.addTrack(t))}catch(e){}if(!rtcStream.getVideoTracks().length)throw new Error('capture');return rtcStream}
function rtcMakePeer(user){let pc=rtcPeers[user];if(pc)return pc;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ontrack=e=>{if(!WATCH||WATCH.host)return;const v=$('vd');if(v){v.srcObject=e.streams[0]||new MediaStream([e.track]);v.play().then(()=>rtcSetStatus('Подключено · видео идёт с устройства ведущего')).catch(()=>rtcSetStatus('Подключено · нажмите ▶, чтобы включить видео'))}};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected')rtcSetStatus('Подключено к ведущему');if(pc.connectionState==='failed')rtcSetStatus('Прямое соединение не удалось. Этой сети может понадобиться TURN‑ретранслятор.');if(pc.connectionState==='disconnected')rtcSetStatus('Соединение восстанавливается…')};rtcPeers[user]=pc;return pc}
function rtcAddTracks(pc,stream){stream.getTracks().forEach(t=>{const s=pc.addTrack(t,stream);try{const p=s.getParameters();if(!p.encodings||!p.encodings.length)p.encodings=[{}];p.encodings[0].maxBitrate=t.kind==='video'?2200000:128000;s.setParameters(p).catch(()=>{})}catch(e){}})}
function rtcWaitIce(pc){if(pc.iceGatheringState==='complete')return Promise.resolve();return new Promise(resolve=>{const done=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);pc.removeEventListener('icegatheringstatechange',done);resolve()}};const t=setTimeout(()=>{pc.removeEventListener('icegatheringstatechange',done);resolve()},7000);pc.addEventListener('icegatheringstatechange',done)})}
async function rtcMakeOffer(host){if(!host)host=WATCH&&WATCH.hostName;if(!host){rtcSetStatus('Не удалось определить ведущего');return}try{const pc=rtcMakePeer(host);pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});const offer=await pc.createOffer();await pc.setLocalDescription(offer);await rtcWaitIce(pc);await rtcSend(host,{type:'offer',sdp:pc.localDescription});rtcSetStatus('Ищем прямое соединение…')}catch(e){rtcSetStatus('На этом устройстве нельзя передать видеопоток')}}
async function rtcHandleSignal(m){const user=m.sender,p=m.payload||{};if(!WATCH||!user)return;try{let pc=rtcPeers[user];if(p.type==='offer'&&WATCH.host){pc=rtcMakePeer(user);await pc.setRemoteDescription(p.sdp);const stream=await rtcGetStream();rtcAddTracks(pc,stream);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await rtcWaitIce(pc);await rtcSend(user,{type:'answer',sdp:pc.localDescription});rtcSetStatus('Передаём видео зрителю')}else if(p.type==='answer'&&!WATCH.host&&pc){await pc.setRemoteDescription(p.sdp)}}catch(e){rtcSetStatus('Это устройство не смогло начать передачу видео. Проверьте поддержку WebRTC в приложении')}}
async function rtcPoll(){clearTimeout(rtcPollTimer);if(!WATCH)return;try{const r=await socialCall('watch_signal_poll',{p_code:WATCH.code,p_after:rtcCursor});if(r&&r.ok){for(const m of r.messages||[]){rtcCursor=Math.max(rtcCursor,+m.id||0);await rtcHandleSignal(m)}}}catch(e){}rtcPollTimer=setTimeout(rtcPoll,650)}
function rtcCloseAll(){clearTimeout(rtcPollTimer);Object.values(rtcPeers).forEach(p=>{try{p.close()}catch(e){}});rtcPeers={};rtcStream=null}
function watchLoop(){clearTimeout(watchPoll);if(!WATCH||!ACC)return;watchPoll=setTimeout(async()=>{const room=WATCH;if(!room)return;try{if(room.host){const v=$('vd'),d=curV&&curV[0]=='p'?get(curV[2]):null;if(v&&d&&d.title.toLowerCase()===room.title.toLowerCase()&&d.type===room.type)await socialCall('watch_update',{p_code:room.code,p_position:v.currentTime||0,p_paused:v.paused})}else{const r=await socialCall('watch_state',{p_code:room.code});if(r&&r.ok&&r.updated_at!==watchStamp){watchStamp=r.updated_at;const v=$('vd');if(v&&curV&&curV[0]=='w'){if(r.paused&&!v.paused)v.pause();else if(!r.paused&&v.paused)v.play().catch(()=>{})}}}}catch(e){}watchLoop()},room.host?1800:1100)}
async function watchStop(){if(WATCH)await socialCall('watch_leave',{p_code:WATCH.code});WATCH=null;clearTimeout(watchPoll);rtcCloseAll();if(curV&&curV[0]=='w'){curV=null;closeD()}if($('social'))$('social').innerHTML=socialH();toast('Вы вышли из комнаты')}

 let r;try{r=await rpc('admin_set_title',{p_token:ACC.token,p_user:u,p_title:t})}catch(e){return toast('Нет связи с сервером')}

let WL=null,WK=false;
